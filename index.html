function CharSplit({ text }) {
  return text.split('').map((c, i) => (
    <span key={i} className="char" style={{ display: 'inline-block', opacity: 0, transform: 'translateY(50px) rotate(8deg)' }}>
      {c === ' ' ? '\u00A0' : c}
    </span>
  ));
}

function LineReveal({ children }) {
  return (
    <span className="split-text" data-animation="slide-up">
      <span className="line"><span className="line-inner">{children}</span></span>
    </span>
  );
}

function SectionDivider({ type = 'glow' }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current) return;
    gsap.from(ref.current, {
      opacity: 0, scaleX: 0.3, duration: 1.2, ease: 'power3.out',
      scrollTrigger: { trigger: ref.current, start: 'top 92%' }
    });
  }, []);

  if (type === 'glow') {
    return (
      <div ref={ref} className="section-divider divider-glow">
        <div className="divider-line"><div className="divider-dot"></div></div>
      </div>
    );
  }
  if (type === 'cosmic') {
    const stars = Array.from({ length: 20 }, (_, i) => (
      <div key={i} className="star-particle" style={{
        left: (Math.random() * 100) + '%', top: (Math.random() * 100) + '%',
        '--dur': (2 + Math.random() * 3) + 's', animationDelay: (Math.random() * 2) + 's'
      }}/>
    ));
    return (
      <div ref={ref} className="section-divider divider-cosmic">
        <div className="divider-line"></div>
        {stars}
      </div>
    );
  }
  if (type === 'ember') {
    const embers = Array.from({ length: 15 }, (_, i) => (
      <div key={i} className="ember-dot" style={{
        left: (Math.random() * 100) + '%', bottom: '0',
        '--dur': (2 + Math.random() * 4) + 's', animationDelay: (Math.random() * 3) + 's'
      }}/>
    ));
    return (
      <div ref={ref} className="section-divider divider-ember">
        <div className="divider-line ember-line"></div>
        {embers}
      </div>
    );
  }
  if (type === 'neon') {
    return (
      <div ref={ref} className="section-divider divider-neon">
        <div className="divider-line"></div>
      </div>
    );
  }
  return <div ref={ref} className="section-divider divider-gradient" />;
}

/* ===== CINEMATIC PRELOADER ===== */
function Preloader({ onComplete }) {
  const ref = React.useRef(null);
  const [progress, setProgress] = React.useState(0);
  const [wordIdx, setWordIdx] = React.useState(0);
  const finishedRef = React.useRef(false);
  const words = ['Developer', 'Engineer', 'Creator', 'Visionary'];

  React.useEffect(() => {
    document.body.style.overflow = 'hidden';
    const timer = setInterval(() => {
      setProgress(p => {
        const next = p + Math.random() * 8 + 2;
        return next >= 100 ? 100 : next;
      });
    }, 50);
    const wordTimer = setInterval(() => setWordIdx(i => (i + 1) % words.length), 600);
    return () => { clearInterval(timer); clearInterval(wordTimer); };
  }, []);

  React.useEffect(() => {
    if (progress >= 100 && !finishedRef.current) {
      finishedRef.current = true;
      setTimeout(() => {
        const el = ref.current;
        if (!el) return;
        gsap.to(el.querySelector('.preloader-inner'), {
          scale: 0.9, opacity: 0, duration: 0.5, ease: 'power3.in'
        });
        gsap.to(el, {
          clipPath: 'inset(0 0 100% 0)', duration: 1.2,
          ease: 'power4.inOut', delay: 0.3,
          onComplete: () => {
            if (el) el.style.display = 'none';
            document.body.style.overflow = '';
            onComplete();
          }
        });
      }, 400);
    }
  }, [progress]);

  return (
    <div className="preloader" ref={ref}>
      <div className="preloader-grain"></div>
      <div className="preloader-inner">
        <div className="preloader-logo">
          <span className="pl-letter">A</span><span className="pl-letter">B</span>
          <span className="pl-letter">H</span><span className="pl-letter">I</span>
          <span className="pl-letter">J</span><span className="pl-letter">A</span>
          <span className="pl-letter">Y</span>
        </div>
        <div className="preloader-counter">
          <span className="counter-num">{String(Math.round(progress)).padStart(3, '0')}</span>
        </div>
        <div className="preloader-bar">
          <div className="preloader-fill" style={{ width: progress + '%' }}></div>
        </div>
        <div className="preloader-words">
          {words.map((w, i) => (
            <div key={i} className={`pw-line ${i === wordIdx ? 'active' : ''} ${i === (wordIdx === 0 ? words.length - 1 : wordIdx - 1) ? 'exit' : ''}`}>
              <span>{w}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ===== CUSTOM CURSOR ===== */
function CustomCursor() {
  const cursorRef = React.useRef(null);
  const dotRef = React.useRef(null);
  const textRef = React.useRef(null);

  React.useEffect(() => {
    const cursor = cursorRef.current;
    const dot = dotRef.current;
    const textEl = textRef.current;
    let mx = -100, my = -100, cx = -100, cy = -100;

    const onMove = (e) => {
      mx = e.clientX; my = e.clientY;
      dot.style.left = mx + 'px'; dot.style.top = my + 'px';
    };
    document.addEventListener('mousemove', onMove);

    let rafId;
    function tick() {
      cx += (mx - cx) * 0.12; cy += (my - cy) * 0.12;
      cursor.style.left = cx + 'px'; cursor.style.top = cy + 'px';
      rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);

    const setupHovers = () => {
      document.querySelectorAll('a, button, .magnetic-wrap').forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
        el.addEventListener('mouseleave', () => { cursor.classList.remove('hover'); cursor.classList.remove('text-mode'); textEl.textContent = ''; });
      });
      document.querySelectorAll('[data-cursor]').forEach(el => {
        el.addEventListener('mouseenter', () => { cursor.classList.add('text-mode'); textEl.textContent = el.dataset.cursor; });
        el.addEventListener('mouseleave', () => { cursor.classList.remove('text-mode'); textEl.textContent = ''; });
      });
    };
    setTimeout(setupHovers, 600);

    return () => { document.removeEventListener('mousemove', onMove); cancelAnimationFrame(rafId); };
  }, []);

  return (
    <>
      <div className="cursor" ref={cursorRef}><span className="cursor-text" ref={textRef}></span></div>
      <div className="cursor-dot" ref={dotRef}></div>
    </>
  );
}

/* ===== PROGRESS BAR ===== */
function ProgressBar() {
  const fillRef = React.useRef(null);
  React.useEffect(() => {
    const onScroll = () => {
      const y = window.scrollY;
      const docH = document.documentElement.scrollHeight - window.innerHeight;
      if (fillRef.current && docH > 0) fillRef.current.style.width = (y / docH * 100) + '%';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return <div className="progress-bar"><div className="pb-fill" ref={fillRef}></div></div>;
}

/* ===== AUDIO PLAYER ===== */
const THEME_AUDIO = {
  SPACE: 'audio/interstellar.mp3',
  EXPLORE: 'audio/interstellar.mp3',
  ANIME: 'audio/anime_piano.mp3',
  GOT: 'audio/got.mp3',
  HOGWARTS: 'audio/harry_potter.mp3',
  CERTIFICATIONS: 'audio/harry_potter.mp3',
  TRANSFORMERS: 'audio/transformers.mp3',
  CONTACT: 'audio/naruto_despair.mp3',
};

function AudioPlayer({ activeTheme, musicConsent }) {
  const [playing, setPlaying] = React.useState(false);
  const audioMapRef = React.useRef({});
  const currentTrackRef = React.useRef(null);
  const fadeDuration = 1.2;

  // Create/get Audio instance for a given track src
  const getAudio = (src) => {
    if (!audioMapRef.current[src]) {
      const a = new Audio(src);
      a.loop = true;
      a.volume = 0;
      a.preload = 'auto';
      audioMapRef.current[src] = a;
    }
    return audioMapRef.current[src];
  };

  // Crossfade to the new theme track
  React.useEffect(() => {
    if (!playing) return;
    const newSrc = THEME_AUDIO[activeTheme] || THEME_AUDIO.SPACE;
    if (currentTrackRef.current && currentTrackRef.current.src && currentTrackRef.current.src.endsWith(newSrc.replace(/.*\//, ''))) return;

    const oldAudio = currentTrackRef.current;
    const newAudio = getAudio(newSrc);
    currentTrackRef.current = newAudio;

    // Fade out old
    if (oldAudio && oldAudio !== newAudio) {
      gsap.to(oldAudio, { volume: 0, duration: fadeDuration, ease: 'power2.inOut', onComplete: () => { oldAudio.pause(); } });
    }

    // Fade in new
    newAudio.play().catch(() => {});
    gsap.to(newAudio, { volume: 0.25, duration: fadeDuration, ease: 'power2.inOut' });
  }, [activeTheme, playing]);

  // Cleanup
  React.useEffect(() => {
    return () => {
      Object.values(audioMapRef.current).forEach(a => { a.pause(); a.src = ''; });
      audioMapRef.current = {};
    };
  }, []);

  // Respect consent choice. "Yes" starts current theme music, "No" keeps audio paused.
  React.useEffect(() => {
    if (musicConsent === true && !playing) {
      const src = THEME_AUDIO[activeTheme] || THEME_AUDIO.SPACE;
      const audio = getAudio(src);
      currentTrackRef.current = audio;
      audio.play().catch(() => {});
      gsap.to(audio, { volume: 0.25, duration: 0.6 });
      setPlaying(true);
    }
    if (musicConsent === false && playing) {
      const current = currentTrackRef.current;
      if (current) {
        gsap.to(current, { volume: 0, duration: 0.4, onComplete: () => current.pause() });
      }
      setPlaying(false);
    }
  }, [musicConsent]);

  const toggle = () => {
    if (playing) {
      // Pause current track
      const current = currentTrackRef.current;
      if (current) {
        gsap.to(current, { volume: 0, duration: 0.4, onComplete: () => current.pause() });
      }
      setPlaying(false);
    } else {
      // Start playing current theme's track
      const src = THEME_AUDIO[activeTheme] || THEME_AUDIO.SPACE;
      const audio = getAudio(src);
      currentTrackRef.current = audio;
      audio.play().catch(() => {});
      gsap.to(audio, { volume: 0.25, duration: 0.6 });
      setPlaying(true);
    }
  };

  const trackLabel = activeTheme || 'SPACE';
  const showPromptHint = musicConsent === null;

  return (
    <button className={`audio-toggle ${playing ? 'playing' : ''}`} onClick={toggle} aria-label="Toggle theme music">
      <span className="audio-label">{showPromptHint ? 'MUSIC ?' : (playing ? trackLabel : 'PLAY THEME')}</span>
      {playing ? (
        <div className="audio-bars"><span></span><span></span><span></span><span></span></div>
      ) : (
        <div className="audio-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/>
          </svg>
        </div>
      )}
    </button>
  );
}

function TypewriterText({ words, typingSpeed = 80, deletingSpeed = 45, pauseTime = 1200 }) {
  const [text, setText] = React.useState('');
  const [wordIndex, setWordIndex] = React.useState(0);
  const [isDeleting, setIsDeleting] = React.useState(false);

  React.useEffect(() => {
    if (!words || words.length === 0) return;
    const currentWord = words[wordIndex % words.length];
    const nextText = isDeleting
      ? currentWord.substring(0, text.length - 1)
      : currentWord.substring(0, text.length + 1);

    const timeout = setTimeout(() => {
      setText(nextText);
      if (!isDeleting && nextText === currentWord) {
        setTimeout(() => setIsDeleting(true), pauseTime);
      } else if (isDeleting && nextText === '') {
        setIsDeleting(false);
        setWordIndex((prev) => (prev + 1) % words.length);
      }
    }, isDeleting ? deletingSpeed : typingSpeed);

    return () => clearTimeout(timeout);
  }, [text, isDeleting, wordIndex, words, typingSpeed, deletingSpeed, pauseTime]);

  return (
    <span className="typewriter" aria-live="polite">
      {text}
      <span className="typewriter-cursor">|</span>
    </span>
  );
}

/* ===== HERO ===== */
function HeroSection({ loaded }) {
  const canvasRef = React.useRef(null);
  const sectionRef = React.useRef(null);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || typeof THREE === 'undefined') return;
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0a0a0c, 8, 16);
    const camera = new THREE.PerspectiveCamera(58, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.25, 7);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const geoBin = [];
    const matBin = [];
    const trackGeo = (g) => { geoBin.push(g); return g; };
    const trackMat = (m) => { matBin.push(m); return m; };

    const hemi = new THREE.HemisphereLight(0xa8b7ff, 0x050507, 1.2);
    scene.add(hemi);
    const key = new THREE.PointLight(0xc3ff37, 1.1, 18, 2);
    key.position.set(2.8, 4.2, 4.8);
    scene.add(key);
    const rim = new THREE.PointLight(0x7b8cff, 0.8, 20, 2);
    rim.position.set(-4, 1.8, -3.5);
    scene.add(rim);

    const heroRig = new THREE.Group();
    heroRig.position.set(1.4, -0.45, 0);
    scene.add(heroRig);

    const deskGroup = new THREE.Group();
    const deskTop = new THREE.Mesh(
      trackGeo(new THREE.BoxGeometry(4.8, 0.24, 2.5)),
      trackMat(new THREE.MeshStandardMaterial({ color: 0x14181e, roughness: 0.9, metalness: 0.15 }))
    );
    deskGroup.add(deskTop);
    const legGeo = trackGeo(new THREE.BoxGeometry(0.16, 1.4, 0.16));
    const legMat = trackMat(new THREE.MeshStandardMaterial({ color: 0x0d1016, roughness: 0.95, metalness: 0.2 }));
    [[2.2, -0.8, 1.1],[-2.2, -0.8, 1.1],[2.2, -0.8, -1.1],[-2.2, -0.8, -1.1]].forEach(([x,y,z]) => {
      const leg = new THREE.Mesh(legGeo, legMat);
      leg.position.set(x, y, z);
      deskGroup.add(leg);
    });
    heroRig.add(deskGroup);

    const laptopGroup = new THREE.Group();
    laptopGroup.position.set(0, 0.25, -0.1);
    heroRig.add(laptopGroup);

    const laptopBaseMat = trackMat(new THREE.MeshStandardMaterial({ color: 0x1b1f28, roughness: 0.5, metalness: 0.45 }));
    const laptopBase = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(1.65, 0.1, 1.05)), laptopBaseMat);
    laptopBase.position.y = 0.04;
    laptopGroup.add(laptopBase);

    const keyboardDeck = new THREE.Mesh(
      trackGeo(new THREE.PlaneGeometry(1.42, 0.76)),
      trackMat(new THREE.MeshBasicMaterial({ color: 0x0f1218, transparent: true, opacity: 0.75 }))
    );
    keyboardDeck.position.set(0, 0.095, 0.02);
    keyboardDeck.rotation.x = -Math.PI / 2;
    laptopGroup.add(keyboardDeck);

    const screenPivot = new THREE.Group();
    screenPivot.position.set(0, 0.09, -0.47);
    screenPivot.rotation.x = -1.08;
    laptopGroup.add(screenPivot);

    const screenShellMat = trackMat(new THREE.MeshStandardMaterial({ color: 0x161a22, roughness: 0.45, metalness: 0.55 }));
    const screenShell = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(1.62, 1.02, 0.08)), screenShellMat);
    screenPivot.add(screenShell);

    const screenCanvas = document.createElement('canvas');
    screenCanvas.width = 640;
    screenCanvas.height = 360;
    const sctx = screenCanvas.getContext('2d');
    const screenTexture = new THREE.CanvasTexture(screenCanvas);
    screenTexture.minFilter = THREE.LinearFilter;
    screenTexture.magFilter = THREE.LinearFilter;

    const drawScreen = (t) => {
      if (!sctx) return;
      const w = screenCanvas.width;
      const h = screenCanvas.height;
      const grd = sctx.createLinearGradient(0, 0, w, h);
      grd.addColorStop(0, '#0f1b2d');
      grd.addColorStop(1, '#132133');
      sctx.fillStyle = grd;
      sctx.fillRect(0, 0, w, h);

      sctx.fillStyle = 'rgba(195,255,55,0.11)';
      sctx.fillRect(28, 22, w - 56, 40);
      sctx.fillStyle = '#c3ff37';
      sctx.font = '600 20px monospace';
      sctx.fillText('abhijay@portfolio:~$ launch --projects', 44, 48);

      for (let i = 0; i < 12; i++) {
        const y = 84 + i * 20;
        const shift = Math.sin(t * 0.002 + i * 0.6) * 34;
        sctx.fillStyle = i % 3 === 0 ? 'rgba(123,140,255,0.7)' : 'rgba(236,231,225,0.44)';
        sctx.fillRect(44, y, 220 + shift, 3);
      }

      sctx.fillStyle = 'rgba(102,255,204,0.9)';
      sctx.font = '500 16px monospace';
      sctx.fillText('skills.map(k => build(k))', 44, h - 58);
      sctx.fillStyle = 'rgba(236,231,225,0.8)';
      sctx.fillText('status: rendering immersive 3D hero', 44, h - 32);
      screenTexture.needsUpdate = true;
    };

    const screenMat = trackMat(new THREE.MeshStandardMaterial({
      map: screenTexture,
      emissive: new THREE.Color(0x99b8ff),
      emissiveIntensity: 0.35,
      roughness: 0.35,
      metalness: 0.15
    }));
    const screenPanel = new THREE.Mesh(trackGeo(new THREE.PlaneGeometry(1.46, 0.84)), screenMat);
    screenPanel.position.z = 0.045;
    screenPivot.add(screenPanel);

    const globeGroup = new THREE.Group();
    globeGroup.position.set(2.05, 1.08, -0.25);
    heroRig.add(globeGroup);

    const globeCore = new THREE.Mesh(
      trackGeo(new THREE.SphereGeometry(0.72, 32, 32)),
      trackMat(new THREE.MeshStandardMaterial({ color: 0x254079, roughness: 0.4, metalness: 0.55, emissive: 0x0f1733, emissiveIntensity: 0.7 }))
    );
    globeGroup.add(globeCore);

    const globeWire = new THREE.Mesh(
      trackGeo(new THREE.SphereGeometry(0.74, 20, 20)),
      trackMat(new THREE.MeshBasicMaterial({ color: 0xc3ff37, wireframe: true, transparent: true, opacity: 0.25 }))
    );
    globeGroup.add(globeWire);

    const orbitRing = new THREE.Mesh(
      trackGeo(new THREE.TorusGeometry(1.05, 0.016, 20, 120)),
      trackMat(new THREE.MeshBasicMaterial({ color: 0x7b8cff, transparent: true, opacity: 0.55 }))
    );
    orbitRing.rotation.x = Math.PI / 2.8;
    orbitRing.rotation.y = Math.PI / 7;
    globeGroup.add(orbitRing);

    const skillDotCount = 420;
    const dotPos = new Float32Array(skillDotCount * 3);
    for (let i = 0; i < skillDotCount; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const radius = 0.79 + (Math.random() - 0.5) * 0.08;
      dotPos[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
      dotPos[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
      dotPos[i * 3 + 2] = radius * Math.cos(phi);
    }
    const dotGeo = trackGeo(new THREE.BufferGeometry());
    dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
    const skillDots = new THREE.Points(
      dotGeo,
      trackMat(new THREE.PointsMaterial({ size: 0.015, color: 0x66ffcc, transparent: true, opacity: 0.8, sizeAttenuation: true }))
    );
    globeGroup.add(skillDots);

    const mug = new THREE.Mesh(
      trackGeo(new THREE.CylinderGeometry(0.16, 0.15, 0.24, 20)),
      trackMat(new THREE.MeshStandardMaterial({ color: 0xf0f2f8, roughness: 0.65, metalness: 0.1 }))
    );
    mug.position.set(-1.38, 0.24, 0.5);
    heroRig.add(mug);

    const mugHandle = new THREE.Mesh(
      trackGeo(new THREE.TorusGeometry(0.08, 0.015, 10, 24)),
      trackMat(new THREE.MeshStandardMaterial({ color: 0xf0f2f8, roughness: 0.65, metalness: 0.1 }))
    );
    mugHandle.position.set(-1.2, 0.24, 0.5);
    mugHandle.rotation.y = Math.PI / 2;
    heroRig.add(mugHandle);

    const dustCount = 900;
    const dustPos = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++) {
      dustPos[i * 3] = (Math.random() - 0.5) * 16;
      dustPos[i * 3 + 1] = (Math.random() - 0.5) * 8;
      dustPos[i * 3 + 2] = (Math.random() - 0.5) * 12;
    }
    const dustGeo = trackGeo(new THREE.BufferGeometry());
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dust = new THREE.Points(
      dustGeo,
      trackMat(new THREE.PointsMaterial({ size: 0.02, color: 0xece7e1, transparent: true, opacity: 0.22, sizeAttenuation: true }))
    );
    scene.add(dust);

    const pointer = { x: 0, y: 0 };
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const updatePointer = (clientX, clientY) => {
      const rect = canvas.getBoundingClientRect();
      const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
      const ny = -(((clientY - rect.top) / rect.height) * 2 - 1);
      pointer.x = Math.max(-1, Math.min(1, nx));
      pointer.y = Math.max(-1, Math.min(1, ny));
      mouse.set(pointer.x, pointer.y);
    };

    const onMouseMove = (e) => updatePointer(e.clientX, e.clientY);
    const onTouchMove = (e) => {
      if (e.touches && e.touches[0]) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
    };

    const pulseInteractive = () => {
      gsap.fromTo(orbitRing.scale, { x: 1, y: 1, z: 1 }, { x: 1.18, y: 1.18, z: 1.18, yoyo: true, repeat: 1, duration: 0.28, ease: 'power2.inOut' });
      gsap.fromTo(screenMat, { emissiveIntensity: 0.35 }, { emissiveIntensity: 0.62, yoyo: true, repeat: 1, duration: 0.24, ease: 'power2.out' });
      gsap.fromTo(laptopGroup.position, { y: 0.25 }, { y: 0.35, yoyo: true, repeat: 1, duration: 0.22, ease: 'power2.out' });
    };

    const onClick = (e) => {
      updatePointer(e.clientX, e.clientY);
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects([laptopBase, screenPanel, globeCore], false);
      if (hits.length) pulseInteractive();
    };

    canvas.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('touchmove', onTouchMove, { passive: true });
    canvas.addEventListener('click', onClick);

    let animId;
    let t = 0;
    function animate() {
      animId = requestAnimationFrame(animate);
      t += 0.016;
      drawScreen(performance.now());

      globeGroup.rotation.y += 0.008;
      globeWire.rotation.x += 0.002;
      orbitRing.rotation.z += 0.015;
      skillDots.rotation.y -= 0.006;
      dust.rotation.y += 0.0007;
      dust.rotation.x += 0.0002;

      laptopGroup.rotation.x = -0.06 + Math.sin(t * 1.2) * 0.02;
      laptopGroup.rotation.y += (pointer.x * 0.18 - laptopGroup.rotation.y) * 0.08;
      globeGroup.position.y = 1.08 + Math.sin(t * 1.6) * 0.06;

      heroRig.rotation.y += (0.24 + pointer.x * 0.28 - heroRig.rotation.y) * 0.06;
      heroRig.rotation.x += (-0.1 + -pointer.y * 0.15 - heroRig.rotation.x) * 0.06;

      camera.position.x += (pointer.x * 0.58 - camera.position.x) * 0.04;
      camera.position.y += (1.25 + pointer.y * 0.3 - camera.position.y) * 0.04;
      camera.lookAt(scene.position);
      renderer.render(scene, camera);
    }
    animate();

    const onResize = () => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (w && h) { camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); }
    };
    window.addEventListener('resize', onResize);

    return () => {
      cancelAnimationFrame(animId);
      window.removeEventListener('resize', onResize);
      canvas.removeEventListener('mousemove', onMouseMove);
      canvas.removeEventListener('touchmove', onTouchMove);
      canvas.removeEventListener('click', onClick);
      screenTexture.dispose();
      geoBin.forEach((g) => g.dispose());
      matBin.forEach((m) => m.dispose());
      renderer.dispose();
    };
  }, []);

  React.useEffect(() => {
    if (!loaded) return;
    const el = sectionRef.current;
    if (!el) return;
    const tl = gsap.timeline({ defaults: { ease: 'power4.out' } });
    tl.to(el.querySelectorAll('.hero-title .char'), { opacity: 1, y: 0, rotation: 0, stagger: 0.025, duration: 0.8 }, 0.1)
      .from(el.querySelector('.hero-greeting'), { opacity: 0, x: -40, duration: 1 }, 0)
      .from(el.querySelector('.hero-sub'), { opacity: 0, y: 40, duration: 1 }, 0.5)
      .from(el.querySelector('.hero-actions'), { opacity: 0, y: 30, duration: 0.8 }, 0.7)

      .from(el.querySelector('.hero-meta'), { opacity: 0, y: 20, duration: 0.8 }, 1)
      .from(el.querySelector('.hero-bg-word'), { opacity: 0, scale: 0.95, duration: 1.5 }, 0);
  }, [loaded]);

  return (
    <section className="hero" id="hero" ref={sectionRef}>
      <canvas id="hero-canvas" ref={canvasRef}></canvas>
      <div className="hero-overlay"></div>
      <div className="hero-vignette"></div>

      <div className="hero-content">

        <h1 className="hero-title">
          <span className="hero-line"><span className="hero-line-inner"><CharSplit text="ABHIJAY" /></span></span>

        </div>
        <div className="hero-actions">

function AboutSection() {

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || typeof THREE === 'undefined') return;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.z = 5;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    /* Anime-themed particles: sakura pink + neon cyan */
    const starCount = 3000, starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPos[i*3] = (Math.random()-0.5)*25;
      starPos[i*3+1] = (Math.random()-0.5)*25;
      starPos[i*3+2] = (Math.random()-0.5)*25;
    }
    const sGeo = new THREE.BufferGeometry();
    sGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(sGeo, new THREE.PointsMaterial({ size: 0.014, color: 0xff69b4, transparent: true, opacity: 0.6, sizeAttenuation: true }));
    scene.add(stars);

    const spiralCount = 1200, spiralPos = new Float32Array(spiralCount * 3);
    for (let k = 0; k < spiralCount; k++) {
      const a = (k/spiralCount)*Math.PI*8;
      const rad = 0.2+(k/spiralCount)*3;
      const sp = (Math.random()-0.5)*0.3;
      spiralPos[k*3] = Math.cos(a)*rad+sp;
      spiralPos[k*3+1] = (Math.random()-0.5)*0.12;
      spiralPos[k*3+2] = Math.sin(a)*rad+sp;
    }
    const spGeo = new THREE.BufferGeometry();
    spGeo.setAttribute('position', new THREE.BufferAttribute(spiralPos, 3));
    const spiral = new THREE.Points(spGeo, new THREE.PointsMaterial({ size: 0.018, color: 0x00e5ff, transparent: true, opacity: 0.35, sizeAttenuation: true }));
    spiral.rotation.x = Math.PI * 0.38;
    scene.add(spiral);

    const dustCount = 800, dustPos = new Float32Array(dustCount * 3);
    for (let j = 0; j < dustCount; j++) {
      const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1), r = 1.5+Math.random()*4;
      dustPos[j*3] = r*Math.sin(p)*Math.cos(t);
      dustPos[j*3+1] = r*Math.sin(p)*Math.sin(t);
      dustPos[j*3+2] = r*Math.cos(p);
    }
    const dGeo = new THREE.BufferGeometry();
    dGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dust = new THREE.Points(dGeo, new THREE.PointsMaterial({ size: 0.05, color: 0xda70d6, transparent: true, opacity: 0.18, sizeAttenuation: true }));
    scene.add(dust);

    let gmx = 0, gmy = 0;
    const onMouse = (e) => { gmx = (e.clientX/window.innerWidth)*2-1; gmy = (e.clientY/window.innerHeight)*2-1; };
    document.addEventListener('mousemove', onMouse);

    let animId;
    function animate() {
      animId = requestAnimationFrame(animate);
      stars.rotation.y += 0.0002; stars.rotation.x += 0.0001;
      dust.rotation.y -= 0.0004;
      spiral.rotation.y += 0.0008;
      camera.position.x += (gmx*0.3-camera.position.x)*0.01;
      camera.position.y += (-gmy*0.2-camera.position.y)*0.01;
      camera.lookAt(scene.position);
      renderer.render(scene, camera);
    }
    animate();

    const onResize = () => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (w && h) { camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h); }
    };
    window.addEventListener('resize', onResize);
    return () => { cancelAnimationFrame(animId); document.removeEventListener('mousemove', onMouse); window.removeEventListener('resize', onResize); renderer.dispose(); };
  }, []);

  React.useEffect(() => {
    const el = ref.current; if (!el) return;
    el.querySelectorAll('[data-animation="char"]').forEach(row => {
      gsap.to(row.querySelectorAll('.char'), {
        y: 0, opacity: 1, rotation: 0, stagger: 0.02, duration: 0.7, ease: 'power3.out',
        scrollTrigger: { trigger: row, start: 'top 82%' }

    gsap.fromTo(el.querySelector('.about-label'), { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, scrollTrigger: { trigger: '.about-label', start: 'top 85%' } });
    gsap.fromTo(el.querySelector('.portrait-box'), { scale: 0.8, opacity: 0, rotateY: 15 }, { scale: 1, opacity: 1, rotateY: 0, duration: 1.2, ease: 'power3.out', scrollTrigger: { trigger: '.portrait-box', start: 'top 85%' } });
    gsap.fromTo(el.querySelector('.about-big'), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.2, scrollTrigger: { trigger: '.about-big', start: 'top 85%' } });
    el.querySelectorAll('.about-detail .line-inner').forEach(li => {
      gsap.to(li, { y: 0, duration: 1, ease: 'power3.out', scrollTrigger: { trigger: li.closest('.split-text'), start: 'top 88%' } });
    });
  }, []);

  return (

      <canvas id="galaxy-canvas" ref={canvasRef}></canvas>
      <div className="anime-glow"></div>

      <div className="sakura-layer" aria-hidden="true"></div>
      <div className="section-grain"></div>
      <div className="wrapper">
        <div className="about-top">
          <h2 className="mega-heading">
            <span className="mh-row" data-animation="char"><CharSplit text="WHO " /><span className="stroke-text-inline"><CharSplit text="AM I?" /></span></span>
          </h2>
          <div className="about-portrait">
            <div className="portrait-box cube-scene">
              <div className="cube-3d">
                <div className="cube-face cube-front"><span>&lt;/&gt;</span></div>
                <div className="cube-face cube-back"><span>AP</span></div>
                <div className="cube-face cube-right"><span>AI</span></div>

  React.useEffect(() => {
    const el = ref.current; if (!el) return;
    el.querySelectorAll('[data-animation="char"]').forEach(row => {
      gsap.to(row.querySelectorAll('.char'), {
        y: 0, opacity: 1, rotation: 0, stagger: 0.02, duration: 0.7, ease: 'power3.out',
        scrollTrigger: { trigger: row, start: 'top 85%' }
      });
    });
    el.querySelectorAll('[data-animation="slide-up"] .line-inner').forEach(li => {
      gsap.to(li, { y: 0, duration: 1, ease: 'power3.out', scrollTrigger: { trigger: li.closest('.split-text'), start: 'top 88%' } });
    });

    const track = el.querySelector('.horizontal-track');
    if (track) {
      const cards = track.querySelectorAll('.folio-card');
      let totalW = 0;
      cards.forEach(c => totalW += c.offsetWidth);
      totalW += (cards.length - 1) * 32;
      const moveX = Math.max(0, totalW - window.innerWidth + 80);
      gsap.to(track, {
        x: () => -moveX, ease: 'none',
        scrollTrigger: { trigger: el, start: 'top top', end: () => '+=' + moveX, scrub: 1, pin: true, anticipatePin: 1, invalidateOnRefresh: true }
      });
    }

    el.querySelectorAll('.folio-card').forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left, y = e.clientY - rect.top;
        const midX = rect.width/2, midY = rect.height/2;
        gsap.to(card, { rotateX: ((y-midY)/midY)*-12, rotateY: ((x-midX)/midX)*12, y: -10, duration: 0.3, ease: 'power2.out', transformPerspective: 800 });
      });
      card.addEventListener('mouseleave', () => {
        gsap.to(card, { rotateX: 0, rotateY: 0, y: 0, duration: 0.6, ease: 'elastic.out(1,0.4)' });
      });
    });
  }, []);

  return (
    <section className="full-section folio-section got-theme" id="projects" ref={ref}>
      <div className="got-overlay" aria-hidden="true"></div>

function ContactSection() {
  const ref = React.useRef(null);
  const canvasRef = React.useRef(null);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || typeof THREE === 'undefined') return;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, canvas.clientWidth/canvas.clientHeight, 0.1, 100);
    camera.position.z = 6;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const knot = new THREE.Mesh(
      new THREE.TorusKnotGeometry(2, 0.5, 200, 20, 2, 3),
      new THREE.MeshBasicMaterial({ color: 0xece7e1, wireframe: true, transparent: true, opacity: 0.04 })
    );
    scene.add(knot);

    const aCount = 600, aPos = new Float32Array(aCount * 3);
    for (let i = 0; i < aCount; i++) {
      aPos[i*3] = (Math.random()-0.5)*12;
      aPos[i*3+1] = (Math.random()-0.5)*8;
      aPos[i*3+2] = (Math.random()-0.5)*6;
    }
    const aGeo = new THREE.BufferGeometry();
    aGeo.setAttribute('position', new THREE.BufferAttribute(aPos, 3));
    const aurora = new THREE.Points(aGeo, new THREE.PointsMaterial({ size: 0.025, color: 0x66ffcc, transparent: true, opacity: 0.12, sizeAttenuation: true }));
    scene.add(aurora);

    let animId;
    function animate() {
      animId = requestAnimationFrame(animate);
      knot.rotation.x += 0.0015; knot.rotation.y += 0.002;
      aurora.rotation.y += 0.0003;
      renderer.render(scene, camera);
    }
    animate();
    const onResize = () => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (w && h) { camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h); }
    };
    window.addEventListener('resize', onResize);
    return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', onResize); renderer.dispose(); };
  }, []);

  React.useEffect(() => {
    const el = ref.current; if (!el) return;
    el.querySelectorAll('[data-animation="char"]').forEach(row => {
      gsap.to(row.querySelectorAll('.char'), {

    gsap.fromTo(el.querySelectorAll('.contact-links a'), { y: 25, opacity: 0 }, { y: 0, opacity: 1, stagger: 0.1, duration: 0.6, ease: 'power3.out', scrollTrigger: { trigger: '.contact-links', start: 'top 90%' } });
  }, []);

  return (
    <section className="full-section contact-section aurora-theme" id="contact" ref={ref}>
      <canvas id="contact-canvas" ref={canvasRef}></canvas>
      <div className="aurora-bg" aria-hidden="true"></div>

function BackToTop() {

    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const scrollTop = () => {
    if (window.__lenis) window.__lenis.scrollTo(0, { duration: 2 });

  return (
    <button className={`back-to-top ${visible ? 'visible' : ''}`} onClick={scrollTop} aria-label="Back to top">

/* ===== MAIN APP ===== */
gsap.registerPlugin(ScrollTrigger);

function App() {
  const [loaded, setLoaded] = React.useState(false);
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [activeTheme, setActiveTheme] = React.useState('SPACE');
  const [musicConsent, setMusicConsent] = React.useState(null);
  const lenisRef = React.useRef(null);

  React.useEffect(() => {
    const lenis = new Lenis({
      duration: 1.6,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      orientation: 'vertical',
      gestureOrientation: 'vertical',
      smoothWheel: true,
      smoothTouch: true,
      touchMultiplier: 1.5,
      wheelMultiplier: 1,
    });
    lenisRef.current = lenis;
    window.__lenis = lenis;
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);

    let lastY = 0;
    lenis.on('scroll', (e) => {
      const y = e.animatedScroll || 0;
      const nav = document.getElementById('nav');
      if (nav) {
        nav.classList.toggle('hide', y > lastY && y > 120);
        nav.classList.toggle('scrolled', y > 50);
      }
      lastY = y;
    });

    return () => { lenis.destroy(); window.__lenis = null; };
  }, []);

  React.useEffect(() => {
    if (lenisRef.current) {
      if (menuOpen) lenisRef.current.stop();
      else lenisRef.current.start();
    }
    document.body.style.overflow = menuOpen ? 'hidden' : '';
  }, [menuOpen]);

  React.useEffect(() => {
    if (!loaded) return;

    // Magnetic hover effects
    document.querySelectorAll('.magnetic-wrap').forEach(wrap => {
      const area = wrap.querySelector('.magnetic-area');
      if (!area) return;
      const strength = parseFloat(area.dataset.strength || 20);
      wrap.addEventListener('mousemove', (e) => {
        const rect = wrap.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width/2;
        const y = e.clientY - rect.top - rect.height/2;
        gsap.to(area, { x: x/rect.width*strength, y: y/rect.height*strength, duration: 0.3, ease: 'power2.out' });
      });
      wrap.addEventListener('mouseleave', () => gsap.to(area, { x: 0, y: 0, duration: 0.5, ease: 'elastic.out(1,0.3)' }));
    });

    // Click ripples
    document.querySelectorAll('.btn-ripple').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const rect = btn.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.classList.add('ripple-effect');
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    });

    // Smooth anchor scrolling via Lenis
    document.querySelectorAll('a[href^="#"]').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const target = a.getAttribute('href');
        if (target && lenisRef.current) lenisRef.current.scrollTo(target, { offset: 0, duration: 1.5 });
      });
    });

    // Cinematic section fade-in
    document.querySelectorAll('.full-section').forEach(section => {
      gsap.fromTo(section,
        { opacity: 0.3 },
        { opacity: 1, duration: 1.2, ease: 'power2.out',
          scrollTrigger: { trigger: section, start: 'top 92%', end: 'top 50%', scrub: 0.6 }
        });
    });

    // Parallax layers
    document.querySelectorAll('[data-speed]').forEach(el => {
      const speed = parseFloat(el.dataset.speed || 1);
      gsap.to(el, { yPercent: () => (1-speed)*50, ease: 'none', scrollTrigger: { trigger: el, start: 'top bottom', end: 'bottom top', scrub: 1 } });
    });

    gsap.to('.hero-bg-word', { yPercent: 30, ease: 'none', scrollTrigger: { trigger: '.hero', start: 'top top', end: 'bottom top', scrub: 0.5 } });

    const mc = document.querySelector('.marquee-content');
    if (mc) gsap.to(mc, { x: '-=300', ease: 'none', scrollTrigger: { trigger: '.marquee-section', start: 'top bottom', end: 'bottom top', scrub: 1 } });

    document.querySelectorAll('.shape').forEach((shape, i) => {
      gsap.to(shape, { y: i%2===0 ? -100 : 100, rotation: i%2===0 ? 25 : -25, ease: 'none', scrollTrigger: { trigger: '.trans-section', start: 'top bottom', end: 'bottom top', scrub: 1 } });
    });

    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('mouseenter', () => gsap.to(link, { y: -2, duration: 0.2 }));
      link.addEventListener('mouseleave', () => gsap.to(link, { y: 0, duration: 0.2 }));
    });

    document.querySelectorAll('.icon-bounce').forEach(el => {
      el.addEventListener('mouseenter', () => { el.style.animationPlayState='paused'; gsap.to(el,{scale:1.15,duration:0.3,ease:'back.out(2)'}); });
      el.addEventListener('mouseleave', () => { el.style.animationPlayState='running'; gsap.to(el,{scale:1,duration:0.3}); });
    });

    // Section theme transitions
    const sectionThemes = [
      { el: '#hero', accent: '#c3ff37', name: 'SPACE', navId: 'hero' },
      { el: '.enth-section', accent: '#ffc857', name: 'EXPLORE', navId: '' },
      { el: '#about', accent: '#ff69b4', name: 'ANIME', navId: 'about' },
      { el: '#projects', accent: '#c8a654', name: 'GOT', navId: 'projects' },
      { el: '#skills', accent: '#ffd700', name: 'HOGWARTS', navId: 'skills' },
      { el: '.certs-section', accent: '#a78bfa', name: 'CERTIFICATIONS', navId: '' },
      { el: '#experience', accent: '#1a8cff', name: 'TRANSFORMERS', navId: 'experience' },
      { el: '#contact', accent: '#66ffcc', name: 'CONTACT', navId: 'contact' },
    ];

    let currentTheme = '';
    function applyTheme(accent, name, navId) {
      if (currentTheme === name) return;
      currentTheme = name;
      setActiveTheme(name);
      document.documentElement.style.setProperty('--active-accent', accent);
      const flash = document.getElementById('theme-flash');
      if (flash) {
        flash.style.background = 'radial-gradient(ellipse at center, ' + accent + ', transparent 70%)';
        gsap.fromTo(flash, { opacity: 0 }, { opacity: 0.08, duration: 0.3, yoyo: true, repeat: 1, ease: 'power2.inOut' });
      }
      const nameEl = document.getElementById('section-name');
      if (nameEl) {
        gsap.to(nameEl, { opacity: 0, y: -10, duration: 0.2, onComplete: () => {
          nameEl.textContent = name;
          gsap.to(nameEl, { opacity: 0.5, y: 0, duration: 0.4 });
        }});
      }
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', !!navId && link.getAttribute('href') === '#' + navId);
      });
    }

    sectionThemes.forEach(({ el: sel, accent, name, navId }) => {
      const section = document.querySelector(sel);
      if (!section) return;
      ScrollTrigger.create({
        trigger: section,
        start: 'top 60%',
        end: 'bottom 40%',
        onEnter: () => applyTheme(accent, name, navId),
        onEnterBack: () => applyTheme(accent, name, navId),
      });
    });

    setTimeout(() => ScrollTrigger.refresh(), 500);

  }, [loaded]);

  return (
    <>
      <Preloader onComplete={() => setLoaded(true)} />
      <CustomCursor />
      <Navigation menuOpen={menuOpen} setMenuOpen={setMenuOpen} />
      <MusicConsentPrompt visible={loaded && musicConsent === null} onChoice={setMusicConsent} />
      <AudioPlayer activeTheme={activeTheme} musicConsent={musicConsent} />
      <BackToTop />
      <ThemeFlash />
      <SectionIndicator />
      <HeroSection loaded={loaded} />
      <SectionDivider type="glow" />
      <EnthusiastSection />
      <SectionDivider type="cosmic" />
      <AboutSection />
      <ThemeShiftSection />
      <PortfolioSection />
      <SectionDivider type="ember" />
      <ExpertiseSection />
      <SectionDivider type="glow" />
      <MarqueeSection />
      <SectionDivider type="gradient" />
      <CertsSection />
      <SectionDivider type="gradient" />
      <ExperienceSection />
      <SectionDivider type="glow" />
      <ContactSection />
      <SiteFooter />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
